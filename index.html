<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BakenAI media relay</title>
<style>
:root{--bg:#ffffff;--fg:#1a1d1b;--muted:#5b625e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1110;--fg:#e8ece9;--muted:#a3aba6}}
:root[data-theme="dark"]{--bg:#0e1110;--fg:#e8ece9;--muted:#a3aba6}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px}
p{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>BakenAI media relay</h1>
<p>This site temporarily holds BakenAI's own short videos while they are being published to Instagram through the official Instagram API. Files are removed after publishing.</p>
<p>バケンAIが自分で作った動画を、Instagram公式APIで投稿する間だけ置いておく場所です。投稿が終わったファイルは消えます。</p>
</main>
</body>
</html>
